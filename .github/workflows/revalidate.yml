name: Revalidate blog

# 노션에 글을 쓰거나 고쳐도 깃 커밋이 없어서 Vercel 배포가 돌지 않는다.
# 주기적으로 ISR 재생성을 호출해 새 글이 목록에 반영되도록 한다.
on:
  schedule:
    # 10분마다 (GitHub 무료 러너는 실제 실행이 몇 분 밀릴 수 있음)
    - cron: "*/10 * * * *"
  # 액션 탭에서 수동 실행도 가능
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Call revalidate endpoint
        env:
          SITE_URL: https://bae-log.vercel.app
          TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "REVALIDATE_TOKEN 시크릿이 없습니다. 레포 Settings > Secrets에 등록하세요."
            exit 1
          fi

          # 토큰이 로그에 남지 않도록 URL은 변수로만 조립하고 본문/상태코드만 출력
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w "%{http_code}" --max-time 120 \
            "$SITE_URL/api/revalidate?secret=$TOKEN")

          echo "status: $code"
          cat "$body"
          echo

          if [ "$code" != "200" ]; then
            echo "재생성 실패"
            exit 1
          fi
